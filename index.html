<!DOCTYPE html>
<html lang="vi" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản Lý Hồ Sơ</title>
  <link rel="icon" type="image/png" href="https://img.icons8.com/fluency/512/folder-invoices.png">
  <!-- Thư viện CSS & Font -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet">
  
  <!-- Thư viện JS -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>

  <style>
    /* ========================================= */
    /* GIAO DIỆN TỐI & CSS CORE                  */
    /* ========================================= */
    [data-bs-theme="dark"] { --bs-body-bg: #22272e; --bs-body-color: #adbac7; }
    [data-bs-theme="dark"] .sidebar, [data-bs-theme="dark"] .card, [data-bs-theme="dark"] .bg-white { background-color: #2d333b !important; border-color: #444c56 !important; }
    [data-bs-theme="dark"] .text-dark { color: #cdd9e5 !important; }
    [data-bs-theme="dark"] .text-muted { color: #768390 !important; }
    [data-bs-theme="dark"] .nav-link { color: #adbac7 !important; }
    [data-bs-theme="dark"] .table { border-color: #444c56; }
    [data-bs-theme="dark"] .table-light th { background-color: #373e47 !important; color: #cdd9e5 !important; border-bottom: 2px solid #444c56 !important; }
    [data-bs-theme="dark"] tbody td { background-color: #2d333b !important; color: #adbac7 !important; border-bottom: 1px solid #444c56 !important; }
    [data-bs-theme="dark"] tbody tr:hover td { background-color: #373e47 !important; }
    [data-bs-theme="dark"] .badge.bg-light { background-color: #444c56 !important; color: #cdd9e5 !important; border-color: #545d68 !important; }
    [data-bs-theme="dark"] .form-control, [data-bs-theme="dark"] .form-select, [data-bs-theme="dark"] .btn-light, [data-bs-theme="dark"] #theme-toggle { background-color: #22272e !important; border-color: #444c56 !important; color: #adbac7 !important; }
    [data-bs-theme="dark"] .swal2-popup, [data-bs-theme="dark"] .modal-body, [data-bs-theme="dark"] .modal-footer { background-color: #2d333b !important; color: #adbac7 !important; }
    [data-bs-theme="dark"] .border { border-color: #444c56 !important; }
    
    :root { --sidebar-collapsed: 85px; --sidebar-expanded: 260px; --bs-primary: #d32f2f; --bs-body-bg: #f4f6f9; }
    body { background-color: var(--bs-body-bg); font-family: 'Segoe UI', Roboto, sans-serif; overflow-x: hidden; margin: 0; }
    
    #login-section { height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); }
    .login-card { background: #fff; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); overflow: hidden; width: 100%; max-width: 400px; }
    .login-header { background: linear-gradient(135deg, #d32f2f 0%, #ff5252 100%); padding: 30px 20px; text-align: center; color: white; }
    .login-header i { font-size: 3rem; margin-bottom: 10px; }
    
    .sidebar { width: var(--sidebar-collapsed); height: 100vh; position: fixed; left: 0; top: 0; background: #fff; border-right: 1px solid #dee2e6; overflow-x: hidden; overflow-y: auto; z-index: 1000; transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column; }
    .sidebar:hover { width: var(--sidebar-expanded); box-shadow: 4px 0 25px rgba(0,0,0,0.15); }
    .sidebar:not(:hover) #theme-toggle { display: none !important; }
    
    .main-content { margin-left: var(--sidebar-collapsed); min-height: 100vh; display: flex; flex-direction: column; padding: 20px; transition: margin-left 0.3s; }
    .nav-link { color: #212529; display: flex; align-items: center; padding: 12px 20px; border-radius: 0 25px 25px 0; margin-right: 15px; font-weight: 500; cursor: pointer; transition: all 0.3s ease; white-space: nowrap; }
    .sidebar .material-icons, .sidebar .fas, .sidebar .fab { min-width: 30px; text-align: center; } 
    .nav-link:hover, .nav-link.active { background: linear-gradient(135deg, #d32f2f 0%, #ff5252 100%); color: white !important; box-shadow: 0 4px 15px rgba(211, 47, 47, 0.3); }
    
    .sidebar:not(:hover) .hide-when-collapsed { display: none !important; }
    .sidebar:hover .hide-when-collapsed { animation: fadeIn 0.3s ease forwards; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .sidebar:not(:hover) .action-flex { flex-direction: column !important; gap: 12px !important; }
    .sidebar:not(:hover) .action-flex .btn { background: transparent !important; border-color: transparent !important; padding: 0 !important; box-shadow: none !important; }
    .sidebar:not(:hover) .action-flex .btn i { font-size: 1.4rem !important; }
    
    .text-primary { color: var(--bs-primary) !important; }
    .bg-primary { background-color: var(--bs-primary) !important; }
    .btn-primary { background-color: var(--bs-primary); border-color: var(--bs-primary); color: white; }
    .btn-primary:hover { background-color: #b71c1c; border-color: #b71c1c; color: white;}
  </style>
</head>
<body>

  <!-- ==================== MÀN HÌNH ĐĂNG NHẬP ==================== -->
  <div id="login-section">
    <div class="login-card">
      <div class="login-header">
        <i class="fas fa-shield-alt"></i>
        <h4 class="fw-bold mb-0 text-white">HỆ THỐNG HỒ SƠ</h4>
        <small class="opacity-75">Trường THPT Nguyễn Trãi</small>
      </div>
      <div class="p-4">
        <form id="loginForm" onsubmit="event.preventDefault(); doLogin();">
          <div class="mb-3">
            <label class="form-label fw-medium text-secondary small">Email đăng nhập</label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="fas fa-envelope text-secondary"></i></span>
              <input type="email" class="form-control" id="email" placeholder="Nhập email..." required>
            </div>
          </div>
          <div class="mb-4">
            <label class="form-label fw-medium text-secondary small">Mật khẩu</label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="fas fa-lock text-secondary"></i></span>
              <input type="password" class="form-control" id="password" placeholder="Nhập mật khẩu..." required>
            </div>
          </div>
          <button type="submit" class="btn btn-primary w-100 rounded-pill shadow-sm py-2">
            ĐĂNG NHẬP <i class="fas fa-sign-in-alt ms-1"></i>
          </button>
        </form>
      </div>
    </div>
  </div>

  <!-- ==================== KHUNG GIAO DIỆN CHÍNH ==================== -->
  <div id="app-wrapper" style="display: none;">
    <!-- SIDEBAR MENU -->
    <nav class="sidebar py-3" id="app-sidebar">
      <div class="text-center mb-2">
        <h5 class="fw-bold text-primary text-uppercase mt-2 mb-3 hide-when-collapsed">Quản Lý Hồ Sơ</h5>
        <div class="d-flex align-items-center justify-content-center px-2">
          <img src="" id="user-avatar" class="rounded-circle shadow-sm" width="42" height="42" style="object-fit: cover; border: 2px solid var(--bs-primary);">
          <button class="btn border rounded-circle ms-2 d-flex align-items-center justify-content-center" id="theme-toggle" style="width: 36px; height: 36px; flex-shrink: 0; background: #f8f9fa;" title="Đổi giao diện">
            <i class="fas fa-moon text-secondary fs-6"></i>
          </button>
        </div>
        
        <div class="hide-when-collapsed mt-3">
          <div id="user-name" class="fw-bold text-dark text-truncate">...</div>
          <small class="text-muted d-block text-truncate mb-2" id="user-email">... </small>
          <span id="user-role" class="badge bg-secondary rounded-pill mb-3 px-3">...</span>
          <div class="px-4">
            <button onclick="doLogout()" class="btn btn-sm btn-outline-danger rounded-pill w-100 fw-medium d-flex align-items-center justify-content-center">
              <i class="fas fa-sign-out-alt"></i> <span class="ms-1">Đăng xuất</span>
            </button>
          </div>
        </div>
      </div>
      
      <hr class="mx-3 mt-0 mb-2 text-secondary opacity-25">
      
      <ul class="nav flex-column flex-grow-1">
        <li class="nav-item">
          <a class="nav-link active" onclick="loadModule('dashboard')">
            <i class="material-icons">dashboard</i> <span class="hide-when-collapsed ms-2">Quản lý Hồ sơ</span>
          </a>
        </li>
        <li class="nav-item" id="nav-upload" style="display: none;">
          <a class="nav-link" onclick="loadModule('upload')">
            <i class="material-icons">cloud_upload</i> <span class="hide-when-collapsed ms-2">Tải lên hồ sơ</span>
          </a>
        </li>
        <div id="admin-menu" style="display: none;">
          <h6 class="px-3 mt-4 mb-2 text-muted text-uppercase fw-bold hide-when-collapsed" style="font-size: 0.75rem;">Hệ thống</h6>
          <li class="nav-item">
            <a class="nav-link" onclick="loadModule('users')">
              <i class="material-icons">people</i> <span class="hide-when-collapsed ms-2">Quản lý Nhân sự</span>
            </a>
          </li>
        </div>
      </ul>
      
      <!-- LIÊN KẾT NGOÀI -->
      <div class="d-flex action-flex gap-2 justify-content-center">
        <a href="https://zalo.me/g/nuryfm609" target="_blank" class="btn btn-light border flex-grow-1 text-decoration-none d-flex align-items-center justify-content-center px-0">
          <i class="fas fa-comment-dots fs-5" style="color: #0068ff;"></i> <span class="hide-when-collapsed ms-2 fw-bold" style="color: #0068ff; font-size: 0.85rem;">Zalo</span>
        </a>
        <a href="https://www.facebook.com/loquocthai" target="_blank" class="btn btn-light border flex-grow-1 text-decoration-none d-flex align-items-center justify-content-center px-0">
          <i class="fab fa-facebook fs-5" style="color: #1877f2;"></i> <span class="hide-when-collapsed ms-2 fw-bold" style="color: #1877f2; font-size: 0.85rem;">Admin</span>
        </a>
      </div>
    </nav>

    <!-- KHUNG CHỨA NỘI DUNG -->
    <div class="main-content" id="app-content"></div>
  </div>

  <!-- ==================== HỆ THỐNG JAVASCRIPT LÕI ==================== -->
  <script>
    // 🚨 THẦY DÁN ĐƯỜNG LINK WEB APP URL TỪ BƯỚC 1 VÀO ĐÂY NHÉ:
    const API_URL = "https://script.google.com/macros/s/AKfycbwvyfKYxlOXIKL-MKu0esCIsEIMqWf5eSzrE6zjV1vEMCXn6FJONVNSRqoJDS9Kk6tE/exec";
    
    let currentUser = null;
    let currentUsersList = []; 
    let currentDocsList = []; 

    window.onload = function() {
      const savedUser = localStorage.getItem('currentUser');
      if (savedUser) { currentUser = JSON.parse(savedUser); activateAppInterface(); }
    };

    function doLogin() {
      const email = document.getElementById('email').value;
      const pass = document.getElementById('password').value;
      Swal.fire({ title: 'Đang xác thực...', text: 'Kết nối máy chủ an toàn...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

      fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: "login", email: email, password: pass }) })
      .then(res => res.json())
      .then(data => {
        if (data.status === 'success') {
          currentUser = data.user; localStorage.setItem('currentUser', JSON.stringify(currentUser));
          Swal.close(); activateAppInterface();
        } else { Swal.fire('Thất bại', data.message, 'error'); }
      }).catch(err => Swal.fire('Lỗi', 'Mất kết nối máy chủ dữ liệu!', 'error'));
    }

    function doLogout() {
      localStorage.removeItem('currentUser'); currentUser = null;
      document.getElementById('app-wrapper').style.display = 'none';
      document.getElementById('login-section').style.display = 'flex';
      document.getElementById('loginForm').reset();
    }

    function activateAppInterface() {
      document.getElementById('login-section').style.display = 'none';
      document.getElementById('app-wrapper').style.display = 'block';
      document.getElementById('user-name').innerText = currentUser.name;
      document.getElementById('user-email').innerText = currentUser.email;
      document.getElementById('user-role').innerText = currentUser.role;
      document.getElementById('user-avatar').src = 'https://ui-avatars.com/api/?name=' + encodeURIComponent(currentUser.name) + '&background=d32f2f&color=fff';

      document.getElementById('admin-menu').style.display = (currentUser.role === 'Super Admin' || currentUser.permissions.includes('ADMIN')) ? 'block' : 'none';
      document.getElementById('nav-upload').style.display = (currentUser.role === 'Super Admin' || currentUser.permissions.includes('ADD')) ? 'block' : 'none';
      loadModule('dashboard');
    }

    function loadModule(moduleName) {
      $('.nav-link').removeClass('active');
      $(`a[onclick="loadModule('${moduleName}')"]`).addClass('active');
      const contentBox = document.getElementById('app-content');
      const spinner = `<div class="d-flex flex-column justify-content-center align-items-center" style="height: 60vh;"><div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status"></div><h5 class="mt-3 text-primary fw-bold">Đang tải dữ liệu...</h5></div>`;
      
      if (moduleName === 'dashboard') {
        contentBox.innerHTML = spinner;
        fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: "getDashboardData" }) })
        .then(res => res.json()).then(res => { if (res.status === 'success') renderDashboard(res.stats, res.docs); else contentBox.innerHTML = `<div class="alert alert-danger m-4">${res.message}</div>`; })
        .catch(err => { contentBox.innerHTML = `<div class="alert alert-danger m-4">Lỗi máy chủ API!</div>`; });
      } 
      else if (moduleName === 'upload') {
        contentBox.innerHTML = spinner;
        fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: "getConfig" }) })
        .then(res => res.json()).then(res => { if (res.status === 'success') renderUploadUI(res.data); else contentBox.innerHTML = `<div class="alert alert-danger m-4">${res.message}</div>`; })
        .catch(err => { contentBox.innerHTML = `<div class="alert alert-danger m-4">Lỗi kết nối API!</div>`; });
      }
      else if (moduleName === 'users') {
        contentBox.innerHTML = spinner;
        fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: "getUsers" }) })
        .then(res => res.json()).then(res => { if (res.status === 'success') renderUsersUI(res.users); else contentBox.innerHTML = `<div class="alert alert-danger m-4">${res.message}</div>`; })
        .catch(err => { contentBox.innerHTML = `<div class="alert alert-danger m-4">Lỗi máy chủ!</div>`; });
      }
    }

    // ==================================================
    // HÀM VẼ BẢNG ĐIỀU KHIỂN CHÍNH
    // ==================================================
    function renderDashboard(stats, docs) {
      currentDocsList = docs;
      let isManager = (currentUser.role === 'Super Admin' || currentUser.role === 'Quản lí');
      let html = '';

      if (isManager) {
        let subjectCounts = {}; let maxCount = 0;
        docs.forEach(doc => {
          if(doc.boMon) {
            let subjects = doc.boMon.split(',').map(s => s.trim()).filter(Boolean);
            subjects.forEach(s => { subjectCounts[s] = (subjectCounts[s] || 0) + 1; if(subjectCounts[s] > maxCount) maxCount = subjectCounts[s]; });
          }
        });
        let sortedSubjects = Object.keys(subjectCounts).sort((a,b) => subjectCounts[b] - subjectCounts[a]);
        let progressHtml = '';
        if (sortedSubjects.length === 0) progressHtml = '<div class="text-center text-muted fst-italic py-3">Chưa có dữ liệu</div>';
        else sortedSubjects.forEach(s => {
            let count = subjectCounts[s]; let percent = maxCount > 0 ? (count / maxCount) * 100 : 0;
            progressHtml += `<div class="mb-3"><div class="d-flex justify-content-between mb-1"><span class="fw-bold text-dark" style="font-size: 0.95rem;">${s}</span><span class="text-muted small fw-medium">${count} hồ sơ</span></div><div class="progress bg-light border border-light-subtle" style="height: 14px; border-radius: 10px;"><div class="progress-bar bg-danger progress-bar-striped progress-bar-animated" style="width: ${percent}%; border-radius: 10px;"></div></div></div>`;
        });

        html += `
          <div class="row mb-4 mt-2">
            <div class="col-md-4 mb-3"><div class="card bg-primary text-white border-0 shadow-sm rounded-4 h-100"><div class="card-body d-flex align-items-center justify-content-between p-4"><div><h6 class="text-uppercase fw-bold opacity-75 mb-1">TỔNG HỒ SƠ</h6><h2 class="fw-bold mb-0">${stats.totalDocs}</h2></div><div class="bg-white bg-opacity-25 rounded-circle p-3"><i class="fas fa-file-alt fs-2"></i></div></div></div></div>
            <div class="col-md-4 mb-3"><div class="card border-0 shadow-sm rounded-4 h-100" style="background-color: #198754; color: white;"><div class="card-body d-flex align-items-center justify-content-between p-4"><div><h6 class="text-uppercase fw-bold opacity-75 mb-1">TÀI KHOẢN</h6><h2 class="fw-bold mb-0">${stats.totalUsers || 0}</h2></div><div class="bg-white bg-opacity-25 rounded-circle p-3"><i class="fas fa-users fs-2"></i></div></div></div></div>
            <div class="col-md-4 mb-3"><div class="card border-0 shadow-sm rounded-4 h-100" style="background: linear-gradient(135deg, #f44336 0%, #e53935 100%); color: white;"><div class="card-body d-flex align-items-center justify-content-between p-4"><div><h6 class="text-uppercase fw-bold opacity-75 mb-1">DUNG LƯỢNG</h6><h2 class="fw-bold mb-0">${stats.totalSize} MB</h2></div><div class="bg-white bg-opacity-25 rounded-circle p-3"><i class="fas fa-cloud text-white fs-2"></i></div></div></div></div>
          </div>
          <div class="card border-0 shadow-sm rounded-4 mb-4"><div class="card-header bg-white border-0 p-4 pb-0 d-flex align-items-center"><h5 class="fw-bold text-danger mb-0"><i class="fas fa-chart-bar me-2"></i>Thống kê Hồ sơ theo Bộ môn</h5></div><div class="card-body p-4 pt-3">${progressHtml}</div></div>
        `;

        let deptSet = new Set();
        docs.forEach(d => { if(d.boMon) d.boMon.split(',').forEach(s => deptSet.add(s.trim())) });
        let allDepts = [...deptSet].filter(Boolean).sort();
        let allYears = [...new Set(docs.map(d => d.namHoc).filter(Boolean))].sort().reverse();
        let allTypes = [...new Set(docs.map(d => d.loaiHS).filter(Boolean))].sort();
        let allGradesRaw = [...new Set(docs.map(d => d.khoi).filter(Boolean))].sort();
        let allGrades = allGradesRaw.map(g => g.toString().includes('Khối') ? g : `Khối ${g}`);

        html += `
        <div id="table-kho-du-lieu" class="card border-0 shadow-sm rounded-4">
          <div class="card-body p-4">
            <div class="row g-2 mb-4 pb-3 border-bottom">
                <div class="col-md-2"><select id="filter-namhoc" class="form-select text-secondary"><option value="">Tất cả Năm học</option>${allYears.map(y=>`<option value="${y}">${y}</option>`).join('')}</select></div>
                <div class="col-md-2"><select id="filter-bomon" class="form-select text-secondary"><option value="">Tất cả Bộ môn</option>${allDepts.map(d=>`<option value="${d}">${d}</option>`).join('')}</select></div>
                <div class="col-md-3"><select id="filter-loaihs" class="form-select text-secondary"><option value="">Tất cả Loại HS</option>${allTypes.map(t=>`<option value="${t}">${t}</option>`).join('')}</select></div>
                <div class="col-md-2"><select id="filter-khoi" class="form-select text-secondary"><option value="">Tất cả Khối</option>${allGrades.map(g=>`<option value="${g}">${g}</option>`).join('')}</select></div>
                <div class="col-md-1"><button class="btn btn-outline-secondary w-100 fw-medium" onclick="clearFilters()" title="Hủy lọc"><i class="fas fa-sync-alt"></i></button></div>
                <div class="col-md-2"><button class="btn btn-danger w-100 fw-medium" onclick="loadModule('upload')"><i class="fas fa-cloud-upload-alt me-1"></i> Tải Lên</button></div>
            </div>
            <div class="table-responsive">
              <table id="adminDataTable" class="table table-hover align-middle w-100" style="border-bottom: 1px solid #dee2e6;">
                <thead class="table-light text-dark fw-bold">
                  <tr><th style="min-width: 250px;">Hồ sơ</th><th>Bộ môn</th><th>Năm học</th><th>Loại / Khối</th><th>Ngày đăng</th><th class="text-center" style="min-width: 140px;">Thao tác</th></tr>
                </thead>
                <tbody>`;

        docs.reverse().forEach(doc => {
            let icon = 'fa-file-alt text-secondary';
            if(doc.mimeType.includes('pdf')) icon = 'fa-file-pdf text-danger'; 
            else if(doc.mimeType.includes('word')) icon = 'fa-file-word text-danger'; 
            else if(doc.mimeType.includes('excel') || doc.mimeType.includes('spreadsheet')) icon = 'fa-file-excel text-success'; 
            else if(doc.mimeType === 'url') icon = 'fa-link text-info';
            let dateStr = doc.date ? new Date(doc.date).toLocaleDateString('vi-VN') : '';
            
            html += `
            <tr>
                <td><div class="d-flex align-items-center py-2"><i class="fas ${icon} fs-2 me-3"></i><div><div class="fw-bold text-dark" style="font-size: 0.95rem;">${doc.docName}</div><small class="text-muted">${doc.fileName || 'Link đính kèm'}</small></div></div></td>
                <td><span class="badge bg-white text-danger border border-danger-subtle px-3 py-1 rounded-pill">${doc.boMon}</span></td>
                <td><span class="badge bg-secondary px-3 py-1 rounded-pill">${doc.namHoc}</span></td>
                <td><div class="fw-bold text-dark small mb-1">${doc.loaiHS}</div><small class="text-muted">Khối ${doc.khoi}</small></td>
                <td class="small fw-medium text-dark">${dateStr}</td>
                <td class="text-center">
                    <a href="${doc.linkUrl}" target="_blank" class="btn btn-sm btn-outline-danger rounded-2 px-2 m-1" title="Mở file"><i class="fas fa-eye me-1"></i> Mở</a>

          fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'editDocument', doc: result.value }) })
          .then(res => res.json()).then(data => { if(data.status === 'success') { Swal.fire('Thành công', data.message, 'success'); loadModule('dashboard'); } else Swal.fire('Lỗi', data.message, 'error'); }).catch(err => Swal.fire('Lỗi', 'Mất kết nối!', 'error'));

lect" id="upload-khoi" required>${gradesHtml}</select></div></div><hr class="my-4"><div class="text-end"><button type="submit" class="btn btn-primary px-4"><i class="fas fa-paper-plane me-1"></i> Lưu Hệ Thống</button></div></form></div></div>`;

    function handleFileChange(input) { if (input.files && input.files[0]) { $('#link-input').val(input.files[0].name).prop('readonly', true).addClass('bg-light'); $('#btn-clear-file').removeClass('d-none'); } }
    function clearFileSelection() { $('#file-upload').val(''); $('#link-input').val('').prop('readonly', false).removeClass('bg-light').focus(); $('#btn-clear-file').addClass('d-none'); }

    function submitUpload() {
      var docName = $('#upload-name').val().trim(), loaiHS = $('#upload-loaihs').val(), khoi = $('#upload-khoi').val(), namHoc = $('#upload-namhoc').val();
      var checkedDepts = []; $('.up-dept-cb:checked').each(function() { checkedDepts.push($(this).val()); });
      var file = document.getElementById('file-upload').files[0], linkInput = $('#link-input').val().trim();
      if (!docName || !loaiHS || !khoi || !namHoc || checkedDepts.length === 0) return Swal.fire('Thiếu thông tin', 'Điền đủ ô có dấu * và tick Bộ môn', 'warning');
      if (!file && linkInput === '') return Swal.fire('Lỗi', 'Đính kèm File hoặc Link URL!', 'warning');
      Swal.fire({ title: 'Đang xử lý...', text: 'Tải lên an toàn...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
      if (file) {
        if (file.size > 36700160) return Swal.fire('Lỗi', 'File dưới 35MB', 'error');
        var reader = new FileReader();
        reader.onload = function(e) { executeAPIUpload({ action: "uploadDocument", isLink: false, base64: e.target.result.split(',')[1], fileName: file.name, mimeType: file.type, docName: docName, boMon: checkedDepts.join(', '), namHoc: namHoc, loaiHS: loaiHS, khoi: khoi, uploader: currentUser.email }); };
        reader.readAsDataURL(file);
      } else { executeAPIUpload({ action: "uploadDocument", isLink: true, linkUrl: !linkInput.startsWith('http') ? 'https://' + linkInput : linkInput, fileName: "Link", mimeType: "url", docName: docName, boMon: checkedDepts.join(', '), namHoc: namHoc, loaiHS: loaiHS, khoi: khoi, uploader: currentUser.email }); }
    }

    function executeAPIUpload(payload) { fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) }).then(res => res.json()).then(data => { if (data.status === 'success') { Swal.fire('Thành công', data.message, 'success'); loadModule('dashboard'); } else Swal.fire('Lỗi', data.message, 'error'); }).catch(err => Swal.fire('Lỗi', 'Mất kết nối API!', 'error')); }

      let pAdd = u.permissions.includes('ADD') ? 'checked' : '', pEdit = u.permissions.includes('EDIT') ? 'checked' : '', pDel = u.permissions.includes('DEL') ? 'checked' : '';
      Swal.fire({ html: `<div class="text-start"><div class="modal-header bg-danger text-white p-3 d-flex justify-content-between align-items-center"><h5 class="mb-0 fw-bold fs-5">${userId ? 'Cập nhật phân quyền' : 'Thêm nhân sự mới'}</h5><button type="button" class="btn-close btn-close-white" onclick="Swal.close()"></button></div><div class="modal-body p-4 bg-white"><input type="hidden" id="u-id" value="${u.id}"><div class="row mb-3"><div class="col-md-6 mb-2"><label class="form-label small fw-medium text-dark mb-1">Họ và tên <span class="text-danger">*</span></label><input type="text" id="u-name" class="form-control form-control-sm" value="${u.name}"></div><div class="col-md-6 mb-2"><label class="form-label small fw-medium text-dark mb-1">Email Google <span class="text-danger">*</span></label><input type="email" id="u-email" class="form-control form-control-sm" value="${u.email}"></div></div><div class="row mb-3"><div class="col-md-4 mb-2"><label class="form-label small fw-medium text-dark mb-1">Vai trò</label><select id="u-role" class="form-select form-select-sm">${roleHtml}</select><label class="form-label small fw-medium text-dark mt-3 mb-1">Mật khẩu <span class="text-danger">*</span></label><input type="text" id="u-password" class="form-control form-control-sm" value="${u.password}"></div><div class="col-md-4 mb-2"><label class="form-label small fw-medium text-dark mb-1">Chức vụ</label><select id="u-title" class="form-select form-select-sm">${titleHtml}</select></div><div class="col-md-4 mb-2"><label class="form-label small fw-medium text-dark mb-1">Bộ môn/Tổ (Chọn nhiều)</label><div class="border rounded p-2 bg-light custom-scrollbar" style="height: 110px; overflow-y: auto;">${deptHtml}</div></div></div><div class="card mb-3 border border-light-subtle shadow-sm"><div class="card-body p-3"><h6 class="text-danger fw-bold small mb-3">Phân quyền thao tác</h6><div class="d-flex gap-4"><div class="form-check"><input type="checkbox" id="perm-add" class="form-check-input" ${pAdd}><label class="form-check-label fw-medium text-dark small">Thêm/Tải lên</label></div><div class="form-check"><input type="checkbox" id="perm-edit" class="form-check-input" ${pEdit}><label class="form-check-label fw-medium text-dark small">Sửa tên</label></div><div class="form-check"><input type="checkbox" id="perm-del" class="form-check-input" ${pDel}><label class="form-check-label fw-medium text-dark small">Xóa file</label></div></div></div></div><div class="mb-2 w-50"><label class="form-label small fw-medium text-dark mb-1">Trạng thái Khóa/Mở</label><select id="u-status" class="form-select form-select-sm"><option value="Active" ${u.status === 'Active' ? 'selected' : ''}>Hoạt động</option><option value="Locked" ${u.status === 'Locked' ? 'selected' : ''}>Bị khóa</option></select></div></div><div class="modal-footer p-3 bg-light border-top d-flex justify-content-end gap-2"><button type="button" class="btn btn-secondary btn-sm px-4 fw-medium" onclick="Swal.close()">Hủy</button><button type="button" class="btn btn-danger btn-sm px-4 fw-medium" onclick="saveUserFromModal()">${userId ? 'Lưu phân quyền' : 'Thêm nhân sự'}</button></div></div>`, showConfirmButton: false, width: 750, padding: 0, customClass: { popup: 'rounded-3 overflow-hidden border-0 shadow-lg' } });
    }

    function saveUserFromModal() {
        let name = document.getElementById('u-name').value.trim(), email = document.getElementById('u-email').value.trim(), pass = document.getElementById('u-password').value.trim();
        if (!name || !email || !pass) return Swal.fire('Lỗi', 'Vui lòng nhập đủ thông tin!', 'warning');
        let depts = []; document.querySelectorAll('.u-dept-cb:checked').forEach(cb => depts.push(cb.value));
        let perms = []; if(document.getElementById('perm-add').checked) perms.push('ADD'); if(document.getElementById('perm-edit').checked) perms.push('EDIT'); if(document.getElementById('perm-del').checked) perms.push('DEL'); if(document.getElementById('u-role').value === 'Super Admin') perms.push('ADMIN');
        let userData = { id: document.getElementById('u-id').value, name: name, email: email, password: pass, department: depts.join(', '), title: document.getElementById('u-title').value, role: document.getElementById('u-role').value, status: document.getElementById('u-status').value, permissions: perms.join(',') };
        Swal.fire({ title: 'Đang lưu...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
        fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'saveUser', user: userData }) }).then(res => res.json()).then(data => { if(data.status === 'success') { Swal.fire('Thành công', data.message, 'success'); loadModule('users'); } else Swal.fire('Lỗi', data.message, 'error'); }).catch(err => Swal.fire('Lỗi', 'Mất kết nối máy chủ!', 'error'));
    }

    $(document).on('click', '#theme-toggle', function() {
      if ($('html').attr('data-bs-theme') === 'light') { $('html').attr('data-bs-theme', 'dark'); $(this).html('<i class="fas fa-sun text-warning fs-6"></i>'); } 
      else { $('html').attr('data-bs-theme', 'light'); $(this).html('<i class="fas fa-moon text-secondary fs-6"></i>'); }
    }); 
  </script>
</body>
</html>
